[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hertzforge"
version = "0.0.1"
description = "Data acquisition and structural dynamics in one toolset. Early release; the merged code is on its way."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # BSD-3-Clause
    "numpy",
    # BSD-3-Clause
    "scipy",
    # BSD-3-Clause
    "h5py",
    # MIT
    "netCDF4",
    # BSD-3-Clause
    "pint",
    # MIT
    "openpyxl",
    # BSD-3-Clause
    "pandas",
    # BSD-3-Clause
    "threadpoolctl",
    # Apache-2.0 bindings over the OpenCASCADE kernel (LGPL-2.1 with an
    # exception), for STEP and IGES import
    "cadquery-ocp",
]
authors = [{ name = "Brandon Zwink" }, { name = "Kevin Cross" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://hertzforge.com"
Source = "https://github.com/hertzforge/hertzforge"

[project.scripts]
hertzforge = "hertzforge.__main__:main"

[tool.setuptools.package-data]
hertzforge = ["py.typed", "io/escdf_specifications/*.txt", "io/escdf_specifications/LICENSE"]

[tool.pytest.ini_options]
# The package's own tests. The analysis service under python/ has its own
# environment and test suite (uv run --project python pytest python).
testpaths = ["tests"]
addopts = '-m "not slow"'
markers = [
    "slow: the demonstration models, built for the website and the docs; run on demand rather than on every edit",
    "guide: the guide's mesh table, minutes of meshing a shape; checked on main and weekly, not on every pull request",
]
filterwarnings = [
    # netCDF4's published wheel is built against an older numpy C API; the
    # warning is harmless and goes when upstream rebuilds.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
