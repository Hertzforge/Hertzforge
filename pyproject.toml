[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hertzforge"
version = "0.0.1"
description = "Data acquisition and structural dynamics in one toolset. Early release; the merged code is on its way."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # MIT. Its objects are what a .hforge file holds, read and written by its own code.
    "visualdynamics",
    # BSD-3-Clause
    "h5py",
]
authors = [{ name = "Brandon Zwink" }, { name = "Kevin Cross" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://hertzforge.com"
Source = "https://github.com/hertzforge/hertzforge"

[project.scripts]
hertzforge = "hertzforge.__main__:main"

[tool.pytest.ini_options]
# The package's own tests. The analysis service under python/ has its own
# environment and test suite (uv run --project python pytest python).
testpaths = ["tests"]
