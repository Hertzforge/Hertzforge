[package]
name = "hertzforge-law-mimo-zero"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The zero-drive multiple-output law (`hertzforge_mimo_laws::ZeroLaw`) as a law
# file: it proves the path a multiple-output law takes, end to end. Built to a
# law file by `scripts/build_laws.sh`.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../crates/hertzforge-law-sdk" }
hertzforge-mimo-laws = { path = "../../crates/hertzforge-mimo-laws", features = ["law-file"] }
