[package]
name = "hertzforge-law-mimo-sine-steepest-descent"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The built-in MIMO Sine law `steepest_descent` as a law file: the drive moved down the gradient of the squared control error through the identification.
# It is the controller's own law from `hertzforge-mimo-sine-law-math`, built by the
# SDK's `sine_mimo::builtin` constructor and declared by `sine_mimo::builtin::STEEPEST_DESCENT`,
# so the native law and the law file are one implementation. Built to a law file by
# `scripts/build_laws.sh`; its parity with the native law is tested in
# `crates/hertzforge-mimo-sine-laws`.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../crates/hertzforge-law-sdk" }
