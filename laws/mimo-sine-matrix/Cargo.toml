[package]
name = "hertzforge-law-mimo-sine-matrix"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The built-in MIMO Sine law `matrix` as a law file: the correction through the identification's regularized inverse, carried along a model in a sweep (the default).
# It is the controller's own law from `hertzforge-mimo-sine-law-math`, built by the
# SDK's `sine_mimo::builtin` constructor and declared by `sine_mimo::builtin::MATRIX`,
# so the native law and the law file are one implementation. Built to a law file by
# `scripts/build_laws.sh`; its parity with the native law is tested in
# `crates/hertzforge-mimo-sine-laws`.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../crates/hertzforge-law-sdk" }
