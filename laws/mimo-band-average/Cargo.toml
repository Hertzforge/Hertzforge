[package]
name = "hertzforge-law-mimo-band-average"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# Brandon Zwink's band-average multiple-output Random law as a law file. Built by
# `scripts/build_laws.sh`.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../crates/hertzforge-law-sdk" }
hertzforge-mimo-laws = { path = "../../crates/hertzforge-mimo-laws", features = ["law-file"] }
