<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hertzforge</title>
<meta name="description" content="Hertzforge: vibration and shock control, test simulation, environmental specification, data acquisition, data analysis and finite element modeling in one structural dynamics toolset. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hertzforge.com/">
<meta property="og:site_name" content="Hertzforge">
<meta property="og:title" content="Hertzforge">
<meta property="og:description" content="The whole structural dynamics workflow, in one toolset: vibration and shock control, test simulation, environmental specification, data acquisition, data analysis and finite element modeling.">
<meta property="og:image" content="https://hertzforge.com/hertzforge-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Hertzforge logo: a waveform striking a cracked anvil">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1626'/%3E%3Cpath d='M4 16h4l3-8 4 16 4-12 3 6 2-2h4' fill='none' stroke='%23168fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* Dark only: the logo is drawn on black, so the page is the logo's background. */
  :root { --bg: #000000; --fg: #e6ebf1; --muted: #8b97a7; --accent: #168fff; --accent-hi: #8ce4ff; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { margin: 0; }
  /* The logo's edges fade into the page so its rectangle never shows. */
  .logo {
    display: block; width: 100%; max-width: 760px; height: auto; margin: 0 auto;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 2%, #000 98%, transparent),
                        linear-gradient(to bottom, transparent, #000 4%, #000 96%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 2%, #000 98%, transparent),
                linear-gradient(to bottom, transparent, #000 4%, #000 96%, transparent);
    mask-composite: intersect;
  }
  p { margin: 0.4em 0; color: var(--muted); font-size: 1.1rem; }
  .tagline { color: var(--fg); font-size: clamp(1.05rem, 2.6vw, 1.3rem); margin-top: 0.2em; }
  .scope { margin-top: 1.1em; }
  .scope ul {
    list-style: none; padding: 0; margin: 0.5em 0 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5em;
  }
  .scope li {
    white-space: nowrap; color: var(--fg); font-size: 0.9rem; letter-spacing: 0.02em;
    padding: 0.35em 0.85em; border: 1px solid rgba(22, 143, 255, 0.4); border-radius: 999px;
    background: rgba(22, 143, 255, 0.07);
  }
  .demo { margin: 2.2em auto 0; }
  .demo video {
    display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #070b12;
    border: 1px solid rgba(22, 143, 255, 0.35); border-radius: 10px;
    box-shadow: 0 0 48px rgba(22, 143, 255, 0.16), 0 24px 64px rgba(0, 0, 0, 0.7);
  }
  .demo figcaption { color: var(--muted); font-size: 0.95rem; margin-top: 0.9em; }
  .soon { color: var(--fg); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.9rem; margin-top: 2.2em; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hi); }
</style>
</head>
<body>
<main>
  <h1><img class="logo" src="hertzforge-logo.webp" width="1536" height="968" alt="Hertzforge"></h1>
  <p class="tagline">The whole structural dynamics workflow, in one toolset.</p>
  <div class="scope">
    <ul>
      <li>Vibration &amp; Shock Control</li>
      <li>Test Simulation</li>
      <li>Environmental Specification</li>
    </ul>
    <ul>
      <li>Data Acquisition</li>
      <li>Data Analysis</li>
      <li>Finite Element Modeling</li>
    </ul>
  </div>
  <figure class="demo">
    <video id="demo" autoplay muted loop playsinline poster="hertzforge-demo-poster.jpg" width="1920" height="1080"
           aria-label="A walkthrough of the Hertzforge prototype: analysis, modal and simulation workspaces">
      <source src="hertzforge-demo.mp4" type="video/mp4">
    </video>
    <figcaption>The first working prototype, October 2026.</figcaption>
  </figure>
  <p class="soon">Coming soon</p>
  <p><a href="https://github.com/Hertzforge/Hertzforge">GitHub</a></p>
</main>
<script>
  // Respect reduced motion: no autoplay, and give the visitor the controls instead.
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const demo = document.getElementById('demo');
    demo.removeAttribute('autoplay');
    demo.pause();
    demo.controls = true;
  }
</script>
</body>
</html>
