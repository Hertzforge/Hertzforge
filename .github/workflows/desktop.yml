name: desktop

# The desktop app (desktop/, docs/desktop-app.md): its own lint, tests and
# dependency checks, and its installers for macOS, Windows and Linux as artifacts.
# It runs on every push to the desktop branch and on demand, and is not a required
# check: it makes builds for the maintainers to install. The builds are unsigned;
# macOS signing and notarization run only when the repository variable
# HERTZFORGE_SIGN_MACOS is "true" and the signing secrets are set (see the docs).
on:
  push:
    branches: [feature/desktop-app]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The desktop crate is a Cargo workspace of its own, so the controller jobs in
  # ci.yml do not reach it. The UI build is not needed here: a debug build of the
  # app takes the shell from the development server, not from ui/build.
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: The icons the build embeds (made from ui/static/favicon.svg)
        run: npm --prefix desktop ci && npm --prefix desktop run icons
      - name: Formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - name: Lint, as shipped and with the local proof's feature
        run: |
          cargo clippy --manifest-path desktop/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path desktop/Cargo.toml --all-targets --locked --features e2e -- -D warnings
      - name: Test
        run: cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Licenses, bans, sources and advisories (the lockfile holds every platform)
        run: cargo deny --manifest-path desktop/Cargo.toml --config desktop/deny.toml check
      - name: Its license and source policy is the repository's
        run: |
          python3 - <<'PY'
          import sys, tomllib
          root = tomllib.load(open('deny.toml', 'rb'))
          app = tomllib.load(open('desktop/deny.toml', 'rb'))
          same = (root['licenses']['allow'] == app['licenses']['allow']
                  and root['sources'] == app['sources'])
          print('the same policy' if same else 'desktop/deny.toml differs from deny.toml')
          sys.exit(0 if same else 1)
          PY

  installers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, bundles: 'app,dmg', name: macos-arm64}
          - {os: windows-latest, bundles: nsis, name: windows-x64}
          # The oldest supported Ubuntu runner, so the .deb and the AppImage start
          # on the distributions newer than the one that built them.
          - {os: ubuntu-22.04, bundles: 'deb,appimage', name: linux-x64}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # linuxdeploy, which makes the AppImage, is itself an AppImage, and runners
      # have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: The system libraries Tauri builds against on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Build the app and its installers
        run: bash desktop/packaging/build.sh --bundles '${{ matrix.bundles }}'
      # Prepared, not enabled: set the repository variable HERTZFORGE_SIGN_MACOS to
      # "true" once the secrets below exist. It signs every binary in the app with
      # the hardened runtime, notarizes and staples the app, then makes, signs and
      # notarizes the disk image in place of the unsigned one.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && vars.HERTZFORGE_SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          bash desktop/packaging/ci_signing.sh
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          bash desktop/packaging/sign_macos.sh target/release/bundle/macos/Hertzforge.app "$dmg"
      - name: Sizes
        run: |
          {
            echo "## ${{ matrix.name }}"
            find target/release/bundle -maxdepth 2 -type f \
              \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
              -exec du -h {} \;
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hertzforge-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
