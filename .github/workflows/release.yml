# Publishes to PyPI by trusted publishing when a release tagged vX.Y.Z is
# published on GitHub: by hand (the release event), or by desktop.yml, which
# starts this by name on the tag once it has published the release. The PyPI publisher is tied to this file name and to
# the `pypi` environment, so renaming either breaks publishing.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # The shell's build goes into the package, so `hertzforge` with no
      # command can open the interface from a pip install.
      - name: Build the interface
        run: |
          npm ci --prefix ui
          npm --prefix ui run build
          rm -rf src/hertzforge/shell
          cp -R ui/build src/hertzforge/shell
      # The tests CI runs before every merge (ci.yml's package job), so the upload
      # waits on the same answer: the slow and timing tests run on their own there.
      - name: Test
        run: |
          pip install -q . pytest pytest-xdist jsonschema
          bash scripts/fetch_testdata.sh
          python -m pytest tests -q -n auto -m "not slow and not timing"
      - name: Build
        run: |
          pip install -q build
          python -m build
      - name: Check the wheel carries the interface
        run: |
          python -c "import sys, zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'hertzforge/shell/index.html' in names else 'the wheel has no hertzforge/shell/index.html')"
      - uses: pypa/gh-action-pypi-publish@release/v1
