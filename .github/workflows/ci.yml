name: tests

# On every pull request, every push to main, in the merge queue, weekly and
# on demand. The weekly run matters because dependencies are declared by name
# with no pin (Visual Dynamics' principle 12): a new release upstream is
# something new to test even when nothing here changed.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 13 * * 1'          # Mondays, 07:00 Mountain
  workflow_dispatch:

# A newer run on a pull request (or on any branch but main) cancels the one
# it supersedes. Nothing on main is ever cancelled: each run there gets a
# group of its own, its run id. In one shared group a manual or scheduled
# run would cancel a push run still going, and even with cancel-in-progress
# off a newer run replaces one still waiting (a group holds one pending run),
# so a merged commit could end up with no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The hertzforge package on PyPI: its own tests and the repository's lint.
  package:
    runs-on: ubuntu-latest
    # The core suite takes about eight minutes on four workers on a recent
    # Mac; Visual Dynamics measured hosted runners at several times that.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its test tools
        run: pip install -e . pytest pytest-xdist jsonschema ruff
      - name: Lint every Python file in the repository
        run: ruff check .
      - name: No GPL package installed, every import accounted for
        run: python tools/check_licenses.py --scope package
      - name: Fetch the plate test data at the release the core came from
        run: bash scripts/fetch_testdata.sh
      - name: Test
        # the analysis service's tests run in the `analysis` job, on every platform
        run: python -m pytest tests -q -n auto --durations=20 --ignore=tests/service

  # The analysis service (hertzforge.service) on every platform a desktop
  # build targets, in the package's own environment.
  analysis:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.13'}
          - {os: windows-latest, python-version: '3.13'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its test tools
        run: pip install -e . pytest pytest-xdist jsonschema
      - name: Fetch the plate test data at the release the core came from
        run: bash scripts/fetch_testdata.sh
      - name: Test
        run: python -m pytest tests/service -q -n 4 --dist loadgroup -m "not timing"
      - name: Test the timing tests, one at a time
        # Tests marked `timing` assert a wall-clock bound (event-loop latency),
        # which other xdist workers break by sharing the runner's cores. They run
        # here alone, without xdist. The marker is registered in pyproject.toml.
        run: python -m pytest tests/service -q -m timing
      - name: No GPL package installed, every import accounted for
        run: python tools/check_licenses.py --scope package

  # The shell: types, unit tests and a production build, on every platform
  # a desktop build targets.
  shell:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install
        run: npm ci --prefix ui
      - name: Type check
        run: npm --prefix ui run check
      - name: Test
        run: npm --prefix ui test
      - name: Build
        run: npm --prefix ui run build

  # The control service and the controller crates, one Cargo workspace:
  # formatting, lint and tests, on every platform a desktop build targets.
  # The NI backend loads the NI-DAQmx driver at run time, so the runners need
  # no NI software; the tests run on the Sim backend and the driverless paths.
  control:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install --no-self-update
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every test whose verdict does not rest on the wall clock. The timing
      # tests (scripts/rust_timing_tests.txt) run in the `timing` job below.
      - name: Test
        run: bash scripts/rust_tests.sh parallel

  # The timing tests: real-time pacing, deadlines and the 400-channel run,
  # one at a time. They assume a machine that keeps up with real time, which a
  # shared runner does not promise: on 2026-11-01 three of them failed here even
  # run alone (the 400-channel engine run on Linux, the sine bring-up and a
  # controller-timeout run on macOS) while passing on the development machines.
  # So this job reports on every pull request but is not a required check; the
  # same list runs on a dedicated machine before hardware work. Nothing in it
  # is loosened or skipped.
  timing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install --no-self-update
      - name: Test the timing tests, one at a time
        run: bash scripts/rust_tests.sh timing

  # Rust crate licenses, bans, sources and advisories (deny.toml). The
  # lockfile holds every platform's packages and the check reads all of them,
  # so one runner covers the three.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install --no-self-update
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Licenses, bans, sources and advisories
        run: cargo deny check

  # The tree's own rules: no names, every Python file in a license-check
  # scope, permissive npm licenses (tools/check_tree.py, with tests that plant
  # each case). The licenses of the Python packages are checked where they
  # are installed, in the package and analysis jobs (tools/check_licenses.py).
  tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Names, license-check scopes and npm licenses
        run: python tools/check_tree.py
      - name: The checks catch what they claim to
        run: |
          pip install pytest
          python -m pytest tools -q

  # The head branch of a pull request is named for what it carries, the
  # scheme Visual Dynamics uses. Skipped outside pull requests, where there
  # is no head branch to name.
  branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The head branch is named by the scheme
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          pattern='^(fix|feature|docs|tooling)/[a-z0-9][a-z0-9.-]*$|^sync/[0-9]{8}-[0-9]{4}$'
          if [[ $HEAD =~ $pattern ]]; then
            echo "$HEAD"
          else
            echo "::error::The branch '$HEAD' is not named by the scheme: fix/, feature/, docs/ or tooling/, then a short lower-case slug of letters, digits and hyphens, such as fix/decade-axis-ticks. Rename the branch in your fork (the pull request follows the rename) and push again."
            exit 1
          fi
