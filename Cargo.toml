[workspace]
resolver = "2"
# `laws/*` are control laws and `crates/hertzforge-law-host/guests/*` the law
# host's test fixtures: guest crates built to WebAssembly by
# scripts/build_laws.sh. They are members so the workspace lints and tests
# them natively too (a law is plain Rust behind the SDK's trait) and so the
# one lockfile and `cargo deny` cover their dependencies.
members = ["crates/*", "modules/*", "laws/*", "crates/hertzforge-law-host/guests/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared dependency versions. The controller crates live in this repository under
# `crates/hertzforge-*` (modules under `modules/`); nothing outside the repository is
# referenced. The control service reaches only the controller crates on its reviewed
# list (crates/sds-control/tests/forbidden_deps.rs enforces it).
[workspace.dependencies]
hertzforge-breakpoints = { path = "crates/hertzforge-breakpoints" }
hertzforge-capture = { path = "crates/hertzforge-capture" }
hertzforge-channel-table = { path = "crates/hertzforge-channel-table" }
hertzforge-dsp = { path = "crates/hertzforge-dsp" }
hertzforge-hal = { path = "crates/hertzforge-hal" }
hertzforge-hal-sim = { path = "crates/hertzforge-hal-sim" }
hertzforge-module-abi = { path = "crates/hertzforge-module-abi" }
hertzforge-random = { path = "crates/hertzforge-random" }
hertzforge-random-laws = { path = "crates/hertzforge-random-laws" }
hertzforge-reference = { path = "crates/hertzforge-reference" }
hertzforge-sdm = { path = "crates/hertzforge-sdm" }
hertzforge-law-host = { path = "crates/hertzforge-law-host" }
hertzforge-shaker-db = { path = "crates/hertzforge-shaker-db" }
hertzforge-sine = { path = "crates/hertzforge-sine" }
hertzforge-sine-laws = { path = "crates/hertzforge-sine-laws" }
hertzforge-shock-common = { path = "crates/hertzforge-shock-common" }
hertzforge-shock-host = { path = "crates/hertzforge-shock-host" }
hertzforge-shock-law-math = { path = "crates/hertzforge-shock-law-math" }
hertzforge-shock-laws = { path = "crates/hertzforge-shock-laws" }
hertzforge-srs = { path = "crates/hertzforge-srs" }
hertzforge-station = { path = "crates/hertzforge-station" }
hertzforge-twr = { path = "crates/hertzforge-twr" }
# `preserve_order`: protocol headers keep the key order they were written in, which
# the golden frames pin byte for byte.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Profiles are the defaults but for the `opt-level` overrides at the end of this file. One
# setting must not be added without replacing what it would break:
#
# `panic = "abort"` MUST NOT BE ENABLED while drive safety depends on unwinding.
# Two module pumps put their whole tick batch under `catch_unwind` and issue
# `Backend::emergency_stop` from the caught arm: `hertzforge-explorer-host/src/service.rs`
# and `hertzforge-sine/src/service/mod.rs` (`run_one_batch`). `panic = "abort"` deletes the
# unwind those handlers run on, so a panic anywhere under `run_ticks` would end the
# process with the output task still clocked and the output module holding its last
# sample: the one failure a stopped host cannot correct, and the reason the handlers
# exist. Enabling it requires replacing that mechanism first (a signal or exit path
# that can reach the device, or moving the drive off a process whose death is
# survivable), not merely re-testing.

# The overrides: optimized numeric code in a debug build. `opt-level` is the only setting
# changed, so debug assertions, overflow checks and unwinding stay as the dev profile has
# them, and the rule above is untouched. What it costs: a debugger shows optimized code in
# these crates, with locals folded away, and a from-scratch test build of the service's
# packages takes 2.6 times longer (50 s to 130 s on a ten-core Mac) for the optimized
# dependencies. Why: a debug test run of the MIMO Random module spent nearly all its time
# in unoptimized FFT, estimation and simulation code and in the WebAssembly compiler the
# law files go through. Measured on that Mac, the law check test binary took 331 s
# unoptimized and 48 s with these overrides, the law parity tests 39 s and 3 s (the time
# was wasmtime compiling the law files; an explicit list of the linear algebra crates
# alone left it at 38 s, which is why the dependencies are covered as one), and on the
# four-core CI runners the control job's tests took 26 minutes and Windows ran past the
# job's 40. The workspace crates named here are the ones a profile of the law check
# showed; add one when a profile shows it, not by category.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.hertzforge-dsp]
opt-level = 3

[profile.dev.package.hertzforge-sdm]
opt-level = 3

[profile.dev.package.hertzforge-hal-sim]
opt-level = 3

[profile.dev.package.hertzforge-mimo-random]
opt-level = 3
