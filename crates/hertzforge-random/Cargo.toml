[package]
name = "hertzforge-random"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The closed-loop Random CONTROL CORE (`control` module) - the reshaped
# `ControlLaw` trait, the one shipped law `HinvLaw`,
# the control composite (weighted avg/min/max), notch limiting with the safety
# arbitration, and per-bin divergence accounting.
#
# The RANDOM RUN SERVICE (`service` module family) - `RandomService`, the
# level ladder state machine, the alarm/abort envelope + reactive kinematic monitor +
# drive-Vrms clamp/abort + divergence abort + overload proxy protection engines, the
# capture rules + periodic save, and the report + status surface. Path B only: the
# loop runs on the HOST against the Sim plant today; on the delegated path the
# DEVICE closes the loop and none of this runs.

# The control core (`control`) needs only these, and builds for
# `wasm32-wasip2`: the built-in `hinv` law is also built as a law file
# (`laws/hinv`) from this same code, with `default-features = false`.
[dependencies]
hertzforge-dsp = { path = "../hertzforge-dsp" }
hertzforge-breakpoints = { path = "../hertzforge-breakpoints" }
serde = { version = "1", features = ["derive"] }
# Service deps, behind the default `service` feature: shaker-db (feasibility),
# capture (capture/snapshot), channel-table (identity), engine (tri-field
# limits + the engine loop), hal (the `Backend` trait the service is handed).
# NOT hertzforge-hal-sim: it is only a dev-dependency - the service takes a
# `Box<dyn Backend>` from the station factory and no longer manufactures a
# plant. NOT the Explorer service crate: the shared capture infra lives in
# hertzforge-capture.
hertzforge-shaker-db = { path = "../hertzforge-shaker-db", optional = true }
hertzforge-capture = { path = "../hertzforge-capture", optional = true }
hertzforge-channel-table = { path = "../hertzforge-channel-table", optional = true }
hertzforge-engine = { path = "../hertzforge-engine", optional = true }
hertzforge-hal = { path = "../hertzforge-hal", optional = true }
# The shared ARM GATE (`hertzforge_module_abi::arm_gate`): every module's arm path
# runs the two-axis loop resolver + the abort-latency rule + the rate policy
# through ONE function, so a station that cannot honestly run this test
# refuses in the same words everywhere. L4-to-L4; no new layer crossing.
hertzforge-module-abi = { path = "../hertzforge-module-abi", optional = true }
serde_json = { version = "1", optional = true }

[features]
# The run service (`service`): on by default. Off, the crate is the control
# core alone, which is what a control law built to WebAssembly links.
default = ["service"]
service = [
    "dep:hertzforge-shaker-db",
    "dep:hertzforge-capture",
    "dep:hertzforge-channel-table",
    "dep:hertzforge-engine",
    "dep:hertzforge-hal",
    "dep:hertzforge-module-abi",
    "dep:serde_json",
]

[dev-dependencies]
# The adversarial fixtures + the service acceptance tests drive the service/law
# against the SimBackend plant through the real engine, mirroring hertzforge-demo's setup.
hertzforge-hal-sim = { path = "../hertzforge-hal-sim" }
hertzforge-hal = { path = "../hertzforge-hal" }
hertzforge-engine = { path = "../hertzforge-engine" }
hertzforge-channel-table = { path = "../hertzforge-channel-table" }
serde_json = "1"
