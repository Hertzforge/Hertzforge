# eigen-backendd - the headless CORE daemon of the split deployment.
#
# It runs ON the hardware host (the Linux box holding the cDAQ) and serves a remote
# front end over `eigen-protocol` v3 on a WebSocket. THE CONTROL LOOP NEVER CROSSES
# THE NETWORK: the engine, the watchdog and the drive clock are all co-resident with
# the hardware, in THIS process. What crosses is the decimated display path down and
# operator intent up.
#
# DEPENDENCY NOTE: this crate reaches hardware only through `eigen-station`, so it is
# NOT a direct dependent of eigen-hal-sim or eigen-hal-ni and needs no cargo-deny
# wrapper entry. See the comment at the end of deny.toml's [bans] section - a future
# direct dependency has to be argued for there in the same commit.

[package]
name = "eigen-backendd"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

[dependencies]
# The wire contract. v3 exact-match.
eigen-protocol = { path = "../eigen-protocol" }
# THE station factory - the one construction point, shared with the Tauri app.
eigen-station = { path = "../eigen-station" }
# The `Backend` trait (driving a station means calling trait methods).
eigen-hal = { path = "../eigen-hal" }
# `StationClass`, for the arm gate and the provenance label.
eigen-module-abi = { path = "../eigen-module-abi" }
# The channel table: the daemon is AUTHORITATIVE for it in a split deployment.
eigen-channel-table = { path = "../eigen-channel-table" }
# The Data Recorder service - the v1 daemon-side module coverage.
eigen-recorder = { path = "../eigen-recorder" }

eigen-random = { path = "../eigen-random" }
# The host-closes-loop Explorer control core. The device-neutral half of
# the Explorer module: the delegated SMART service is backend-bound and could never be
# linked from this daemon - that split is exactly what `eigen-explorer-host` exists for.
eigen-explorer-host = { path = "../eigen-explorer-host" }
# The CLASSICAL SHOCK service, delegated-backend-FREE by construction. The whole
# point of the `eigen-shock-host` extraction was that this daemon can link the shock
# service without the private delegated backend entering its dependency graph - the
# Path-A crate keeps the delegated firer and that dependency, and could never be linked
# here.
eigen-shock-host = { path = "../eigen-shock-host" }
# The SRS synthesis service. Already delegated-backend-free (its Path-A seam is a trait
# with zero implementors in this workspace).
eigen-srs = { path = "../eigen-srs" }
# The shared shock vocabulary both modules speak: the level ladder, the rate model, the
# drive-limit table, the pulse store.
eigen-shock-common = { path = "../eigen-shock-common" }
# The pulse GENERATOR and the compensation types the wire profile mirrors.
eigen-dsp = { path = "../eigen-dsp" }
# The closed-loop SINE control core. Like `eigen-explorer-host` and
# unlike the delegated SMART service, this crate is delegated-backend-FREE: it takes a
# `Box<dyn Backend>` and a `StationClass`, so the daemon can link it without crossing
# the dependency firewall in deny.toml.
eigen-sine = { path = "../eigen-sine" }
# The TIME WAVEFORM REPLICATION service. Already delegated-backend-
# FREE by construction and there is no extraction crate to make: `eigen-twr` is generic
# over `eigen_hal::Backend` and takes a `StationClass`, so the daemon links the service
# itself without crossing the dependency firewall in deny.toml. Its delegated seam
# (`TwrPath::Delegated`) is a documented shape with no implementor.
eigen-twr = { path = "../eigen-twr" }
eigen-shaker-db = { path = "../eigen-shaker-db" }

eigen-breakpoints = { path = "../eigen-breakpoints" }
# The capture sidecar shapes the LIST verb reads, and the data-root convention.
eigen-capture = { path = "../eigen-capture" }
# The core build stamp on the handshake.
eigen-buildinfo = { path = "../eigen-buildinfo" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The config file format. `parse` only - the daemon never writes its own config.
toml = { version = "0.8", default-features = false, features = ["parse"] }

# The async runtime + WebSocket transport. `tokio-tungstenite` with default features
# OFF: no TLS backend is pulled in, because this seam runs on a trusted lab network
# and adding a TLS stack would drag ring/rustls into a build that must cross-compile
# to the Windows kit without a C toolchain.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "macros",
  "signal",
  "io-util",
] }
# `connect` brings the client half (the soak harness drives the daemon through a real
# socket) and with it `MaybeTlsStream`, whose TLS variants stay compiled out because no
# TLS feature is enabled.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "handshake",
  "connect",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
