[package]
name = "hertzforge-sdm"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false
description = "Spectral density matrix stacks and the multiple-output control-law boundary"

# Pure Rust, no system access: this crate is shared by the control service and
# by law files built for WebAssembly, so it must build for `wasm32-wasip2`.

[dependencies]
num-complex = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# Dense per-line linear algebra (eigen, SVD, Cholesky). MIT. Default features off:
# no rayon (law files are single-threaded WebAssembly), no file or random helpers.
faer = { version = "0.24", default-features = false, features = ["std"] }
