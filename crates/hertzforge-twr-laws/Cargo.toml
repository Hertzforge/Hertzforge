[package]
name = "hertzforge-twr-laws"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The TWR control laws an operator can choose from, and the door every one of them
# goes through: the choice of law for a run (the built-in `twr_correct` or a
# `twr-single` law file from the catalog) resolved to the factory the TWR service
# builds its law with, and the check a law file passes on the simulator before it may
# drive hardware. `hertzforge-twr` does not depend on the law host (or on Wasmtime);
# this crate joins the two, as `hertzforge-sine-laws` does for Sine and
# `hertzforge-shock-laws` for shock. It names no backend: a check case runs on the
# backend it is handed.
[dependencies]
# The TWR service's law seam (`TwrLawFactory`) and its run, for the choice and check.
hertzforge-twr.workspace = true
# The catalog, the choice of law, check records and the arming rule, shared with
# every other world so a law of any world is listed, chosen and cleared the same way.
hertzforge-random-laws.workspace = true
# The abstract backend a check case runs on.
hertzforge-hal.workspace = true

[dev-dependencies]
# The law seam's fault and descriptor types, and the channel table a backend is
# configured with, for the test doubles that pin the refusals.
hertzforge-channel-table.workspace = true
hertzforge-shock-common.workspace = true
