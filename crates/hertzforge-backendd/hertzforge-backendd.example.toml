# hertzforge-backendd - example configuration.
#
# Copy, edit `bind` and `token`, then:  hertzforge-backendd --config <this file> --check
#
# The two REQUIRED fields have no defaults on purpose. See README.md for why a
# wildcard bind and a blank token are both refused at start rather than warned about.

# The EXPLICIT interface this daemon serves on. Use the lab NIC's address, or
# 127.0.0.1 for a same-box front end. NOT 0.0.0.0.
bind = "127.0.0.1:8765"

# The shared admission token every front end presents at the handshake. Change it.
token = "change-me"

# The station this daemon builds for its modules: "sim" or "ni".
station = "sim"

# Which NI devices to bind when station = "ni". Empty = every device the scan finds.
# ni_devices = ["cDAQ9178Sim1Mod1", "cDAQ9178Sim1Mod2"]

# Seconds between heartbeat pings; three missed beats and the peer is treated as gone.
heartbeat_s = 5.0

# Seconds a run CONTINUES after the controller stops answering. The run continuing is
# the point - see README.md.
controller_timeout_s = 30.0

# Where captures, recordings and the advisory lockfile live. Defaults to
# $HERTZFORGE_DATA_ROOT, else ~/Hertzforge_Data.
# data_root = "/var/lib/hertzforge"
