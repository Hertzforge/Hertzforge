[package]
name = "sds-control"
description = "Control service for the structural dynamics suite: runs closed-loop Random on the simulator or NI-DAQmx hardware and serves the sds/1 WebSocket protocol on loopback."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sds-control"
path = "src/main.rs"

[dependencies]
hertzforge-breakpoints.workspace = true
hertzforge-capture.workspace = true
hertzforge-channel-table.workspace = true
hertzforge-dsp.workspace = true
hertzforge-hal.workspace = true
hertzforge-hal-sim.workspace = true
hertzforge-module-abi.workspace = true
hertzforge-random.workspace = true
# The law catalog on the wire (`laws.list`, `laws.import`) and the MIMO setup's law
# choice. Reviewed 2026-11-03: it names no backend; its tests use the Sim as a fixture.
hertzforge-random-laws.workspace = true
# The law catalog's manifest types (parameters, MIMO shapes and diagnostics).
hertzforge-law-host.workspace = true
# The reference builders and readers behind `mimo_random.reference.*` (breakpoints,
# rigid body, import, validation), so the shell never repeats their math.
hertzforge-reference.workspace = true
# Packed spectral matrix stacks and their per-line checks (ranks, eigenvalues).
hertzforge-sdm.workspace = true
hertzforge-shaker-db.workspace = true
hertzforge-station.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake", "connect"] }
