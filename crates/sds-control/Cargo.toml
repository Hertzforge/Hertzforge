[package]
name = "sds-control"
description = "Control service for the structural dynamics suite: runs closed-loop Random on the simulator or NI-DAQmx hardware and serves the sds/1 WebSocket protocol on loopback."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sds-control"
path = "src/main.rs"

[dependencies]
hertzforge-breakpoints.workspace = true
hertzforge-capture.workspace = true
hertzforge-channel-table.workspace = true
hertzforge-dsp.workspace = true
hertzforge-hal.workspace = true
hertzforge-hal-sim.workspace = true
hertzforge-module-abi.workspace = true
hertzforge-random.workspace = true
# The law catalog on the wire (`laws.list`, `laws.import`) and the MIMO setup's law
# choice. Reviewed 2026-11-03: it names no backend; its tests use the Sim as a fixture.
hertzforge-random-laws.workspace = true
# The law catalog's manifest types (parameters, MIMO shapes and diagnostics).
hertzforge-law-host.workspace = true
# Packed spectral matrix stacks and their per-line checks (ranks, eigenvalues).
hertzforge-sdm.workspace = true
hertzforge-shaker-db.workspace = true
# The MIMO Random run service behind the wire's driver trait (src/mimo/adapter.rs).
# Reviewed 2026-11-03: it reaches hardware only through the station backend it is
# handed, and holds the Sim only as a dev-dependency.
hertzforge-mimo-random = { path = "../hertzforge-mimo-random" }
# The native reference file a MIMO setup names by path and hash, and the builders
# and readers behind `mimo_random.reference.*` (breakpoints, rigid body, import,
# validation), so the shell never repeats their math. Reviewed 2026-11-03: file
# reading, validation and pure computation; it names no backend.
hertzforge-reference = { path = "../hertzforge-reference" }
hertzforge-station.workspace = true
# Classical shock (src/shock/): the controller's classical shock service, its
# shared run plumbing (ladder, pulse store, drive limits, the law guards), the
# identification and inverse it closes the loop with, and the door every
# classical law goes through. Reviewed 2026-11-07: each reaches hardware only
# through the station backend it is handed, and holds the Sim only as a
# dev-dependency (tests/forbidden_deps.rs).
hertzforge-shock-common.workspace = true
hertzforge-shock-host.workspace = true
hertzforge-shock-laws.workspace = true
hertzforge-twr.workspace = true
# The built-in classical law's declaration (its parameters and the values it
# reports), so the wire lists and checks it without running it. Plain math.
hertzforge-shock-law-math.workspace = true
# SRS shock (src/srs/): the controller's SRS shock service, its synthesis, tables
# and predictive notch. Reviewed 2026-11-07: it reaches hardware only through the
# station backend it is handed, and holds the Sim only as a dev-dependency
# (tests/forbidden_deps.rs).
hertzforge-srs.workspace = true
# Sine (src/sine/): the controller's Sine service (profile, schedulers, the closed
# loop with its law seam) and the door every Sine law goes through. Reviewed
# 2026-11-08: each reaches hardware only through the station backend it is handed,
# and holds the Sim only as a dev-dependency (tests/forbidden_deps.rs).
hertzforge-sine.workspace = true
hertzforge-sine-laws.workspace = true
# TWR (src/twr/): the door every TWR law goes through (the choice of law
# and the law check). The TWR service itself is `hertzforge-twr` above. Reviewed
# 2026-11-08: it runs a check case on the backend it is handed and names none.
hertzforge-twr-laws.workspace = true
# Explorer (src/explorer/): the controller's hand-steered open-loop sine, its process
# step, run service, analysis pass and run host. Reviewed 2026-11-08: it is handed a
# finished station backend and names none, and holds the Sim only as a
# dev-dependency (tests/forbidden_deps.rs).
hertzforge-explorer-host.workspace = true
# The Recorder (src/recorder/): the controller's acquisition and recording core, its
# trigger, recording writer and reader, and analysis pass. It is handed a finished
# station backend and names none, and holds the Sim only as a dev-dependency
# (tests/forbidden_deps.rs).
hertzforge-recorder.workspace = true
serde_json.workspace = true
# A TWR reference is kept in the data folder under the SHA-256 of its record (MIT
# or Apache-2.0, as the reference reader already has it).
sha2 = "0.10"
# `signal`: Ctrl-C and SIGTERM end a run with its controlled stop (main.rs).
tokio = { workspace = true, features = ["signal"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake", "connect"] }
