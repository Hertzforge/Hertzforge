[package]
name = "eigen-shock-common"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The pulse/transient run infrastructure shared by both shock modules (classical +
# SRS). This crate carries ONLY the tight cut:
#   - path-honesty type seams (DrivePath + PathCapabilities) so the
#     services and UI grey features from ONE source of truth;
#   - the event-driven ShockControlLaw seam + a trivial PerBandGainLaw;
#   - the shock level-ladder state machine (mirrors eigen-random's ladder shape);
#   - per-pulse capture -> SRS -> store on eigen-capture's Snapshot payload seam;
#   - the pulse-train scheduler + rate model, hardware-blocked markers;
#   - the DETERMINISTIC-KINEMATICS feasibility path, reusing the
#     eigen-shaker-db report/item/verdict TYPES and consuming force_shock (which no
#     existing code path consumes) like-for-like by its RatingBasis.
#
# Explicitly OUT of scope: predictive-notch limiting + shaped-sysID
# orchestration live in eigen-srs; tolerance checking lives in eigen-shock-host;
# the FRF engine stays in eigen-dsp.
[dependencies]
eigen-dsp = { path = "../eigen-dsp" }
eigen-shaker-db = { path = "../eigen-shaker-db" }
eigen-capture = { path = "../eigen-capture" }
eigen-channel-table = { path = "../eigen-channel-table" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
