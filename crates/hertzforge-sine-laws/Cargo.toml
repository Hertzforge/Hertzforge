[package]
name = "hertzforge-sine-laws"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The Sine control laws an operator can choose from, and the door every one of them
# goes through: the choice of law for a run (the built-in `servo_blend` or a
# `sine-single` law file from the catalog) resolved to the factory the Sine service
# builds its law with, and the check a law file passes on the simulator before it may
# drive hardware. `hertzforge-sine` does not depend on the law host (or on Wasmtime);
# this crate joins the two, as `hertzforge-random-laws` does for Random and
# `hertzforge-shock-laws` for shock. It names no backend: a check case runs on the
# backend it is handed.
[dependencies]
# The Sine service's law seam (`SineLawFactory`) and its run, for the choice and check.
hertzforge-sine.workspace = true
# The catalog, the choice of law, check records and the arming rule, shared with
# every other world so a law of any world is listed, chosen and cleared the same way.
hertzforge-random-laws.workspace = true
# The abstract backend a check case runs on.
hertzforge-hal.workspace = true
# Sine law files: the `sine-single` world and its contained instance.
hertzforge-law-host.workspace = true
# A check case's run: the channel table its station is configured with, the
# station class its arm gate is given.
hertzforge-channel-table.workspace = true
hertzforge-module-abi.workspace = true

[dev-dependencies]
# TEST FIXTURE ONLY: the check cases and the native-against-file parity run on the
# Sim plant. On deny.toml's hertzforge-hal-sim wrapper list for that reason.
hertzforge-hal-sim.workspace = true
# The FRF stations' matrix stacks.
hertzforge-sdm.workspace = true
