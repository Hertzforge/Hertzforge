[package]
name = "eigen-demo"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The first end-to-end, zero-hardware closed-loop run: Engine (L2) + SimBackend (L3)
# + the control DSP (L1) tied together into a Random-on-Sim control loop that
# demonstrably converges. Pure std + the four workspace crates; no external deps.
[dependencies]
eigen-dsp = { path = "../eigen-dsp" }
eigen-engine = { path = "../eigen-engine" }
eigen-hal-sim = { path = "../eigen-hal-sim" }
eigen-channel-table = { path = "../eigen-channel-table" }
# eigen-hal is pulled in transitively; name it directly so the demo can use the
# Backend trait and its status/caps types without leaning on a re-export.
eigen-hal = { path = "../eigen-hal" }

[[bin]]
name = "eigen-demo"
path = "src/main.rs"
