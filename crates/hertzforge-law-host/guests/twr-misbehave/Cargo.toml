[package]
name = "law-fixture-twr-misbehave"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# A test fixture for the law host and the classical core, not a law to use: a
# classical shock law that misbehaves in the way its `mode` parameter names
# (trap, spin, grow memory, open a file, sleep, return a bad drive...), and
# otherwise is the built-in law. Built to WebAssembly by scripts/build_laws.sh.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../../hertzforge-law-sdk" }
hertzforge-shock-law-math = { path = "../../../hertzforge-shock-law-math" }
