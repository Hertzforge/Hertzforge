[package]
name = "law-fixture-bad-manifest"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# A test fixture for the law host, not a law to use: a well-formed law whose
# manifest has an empty name, which the host must refuse at load. Built to
# WebAssembly by scripts/build_laws.sh.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../../hertzforge-law-sdk" }
