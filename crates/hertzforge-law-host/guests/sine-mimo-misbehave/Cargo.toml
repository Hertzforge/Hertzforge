[package]
name = "law-fixture-sine-mimo-misbehave"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# A test fixture for the law host and the MIMO Sine core, not a law to use: a
# MIMO Sine law that misbehaves in the way its `mode` parameter names (trap,
# spin, grow memory, the wrong drive count, non-finite values, a bad request,
# a notched reference of the wrong length, a drive over its ceiling...), and
# otherwise returns a small steady drive. Built to WebAssembly by
# scripts/build_laws.sh.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../../hertzforge-law-sdk" }
