[package]
name = "law-fixture-misbehave"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# A test fixture for the law host, not a law to use: a law that misbehaves in
# the way its `mode` parameter names (trap, spin, grow memory, open a file,
# sleep, return a bad drive...). Built to WebAssembly by scripts/build_laws.sh.
[lib]
crate-type = ["cdylib"]

[dependencies]
hertzforge-law-sdk = { path = "../../../hertzforge-law-sdk" }
