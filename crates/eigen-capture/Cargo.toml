# eigen-capture - the mode-generic streaming capture writer + its durability guarantees.
#
# The writer used to live in eigen-testkit; it moved here because durability
# (free-space preflight, timed fsync, the provisional sidecar, gap accounting) is
# production behavior, and a crate named "testkit" is the wrong home
# for the code that decides whether a customer's captured data survives a power loss.
# Every caller has since moved onto this crate directly and eigen-testkit is RETIRED;
# its only remaining content was the compatibility `pub use` shim.

[package]
name = "eigen-capture"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

[dependencies]
eigen-channel-table = { path = "../eigen-channel-table" }
# serde/serde_json versions match the rest of the workspace.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-OS home-directory resolution for the default data root (`default_data_root`).
# MIT/Apache-2.0; version matches the `dirs 6.0.0` already in the tree.
dirs = "6"

# statvfs(2) for the REAL free-space preflight (durability quartet rule 1), replacing the 256 GiB
# placeholder in ui/src-tauri/src/recorder.rs. MIT - passes deny.toml's allow list.
# UNIX ONLY: Windows uses the windows-sys arm below. Any other target reports free
# space as UNKNOWN and the preflight REFUSES rather than silently proceeding (see
# `free_space_bytes`).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs"] }

# GetDiskFreeSpaceExW, the Windows arm of the same preflight (without it every
# capture on Windows refused: the free space could not be determined). Raw-dylib
# bindings, no import library. MIT OR Apache-2.0; the version already in Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
