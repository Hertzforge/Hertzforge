[package]
name = "hertzforge-recorder"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The Recorder's core: records a station's inputs and drives nothing. The
# acquisition selection (acq.rs), the trigger and pre-window (trigger.rs), the
# recording writer and reader for the telemetry.f32 / capture.json / recorder.json
# layout (recording.rs), the record store seam and the record thread (store.rs,
# record.rs), the analysis on hertzforge-dsp (analysis.rs), and the RecorderService
# (service/): one engine for the run on the station factory's backend, the trigger,
# the recordings, the marks and the status and report. hertzforge-hal-sim is a
# dev-dependency only: the service takes a `Box<dyn Backend>` from the station
# factory and builds no station of its own.
[dependencies]
hertzforge-capture = { path = "../hertzforge-capture" }
hertzforge-channel-table = { path = "../hertzforge-channel-table" }
hertzforge-dsp = { path = "../hertzforge-dsp" }
hertzforge-engine = { path = "../hertzforge-engine" }
hertzforge-hal = { path = "../hertzforge-hal" }
# The shared arm gate (`hertzforge_module_abi::arm_gate`): every module's arm path
# runs the loop resolver, the abort-latency rule and the rate policy through one
# function, so a station that cannot run the test refuses in the same words
# everywhere.
hertzforge-module-abi = { path = "../hertzforge-module-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The service tests run the Recorder on the simulator and on scripted
# `hertzforge_hal::Backend` doubles; the crate itself names no backend.
hertzforge-hal-sim = { path = "../hertzforge-hal-sim" }
