[project]
name = "sds-analysis"
version = "0.1.0"
description = "Analysis service of the structural dynamics suite: wraps visualdynamics behind the sds/1 WebSocket protocol."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    # MIT. Pinned to upstream main 38cc476 (0.1.0a81, 2026-10-31); the
    # service wraps its public API unchanged.
    "visualdynamics==0.1.0a81",
    # BSD-3-Clause
    "websockets>=15",
    # BSD-3-Clause
    "numpy>=2",
]

[project.scripts]
sds-analysis = "sds_analysis.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
