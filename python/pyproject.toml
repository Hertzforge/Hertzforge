[project]
name = "sds-analysis"
version = "0.1.0"
description = "Analysis service of the structural dynamics suite: wraps visualdynamics behind the sds/1 WebSocket protocol."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # MIT. The service wraps its public API unchanged. Declared by name with
    # no pin, as Visual Dynamics declares its own (its principle 12): CI
    # tests against the latest release, so a change upstream is seen here
    # the week it ships.
    "visualdynamics",
    # BSD-3-Clause
    "websockets",
    # BSD-3-Clause
    "numpy",
]

[project.scripts]
sds-analysis = "sds_analysis.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "jsonschema",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
