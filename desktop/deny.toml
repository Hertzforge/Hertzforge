# cargo-deny for the desktop app, a Cargo workspace of its own (desktop/Cargo.toml):
#
#     cargo deny --manifest-path desktop/Cargo.toml --config desktop/deny.toml check
#
# The license and source policy is the repository's (../deny.toml), repeated here
# because cargo-deny reads one file; the desktop CI job fails if the two lists
# differ. The controller's hardware firewall bans are not repeated: no controller
# crate is in this graph (the app starts the control service as a separate program).

[graph]
all-features = true
exclude = []

[licenses]
version = 2
private = { ignore = false }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
# The window toolkit's graph carries several versions of some crates.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not a vulnerability: a procedural-macro helper used at build time
  # by the GTK 3 bindings (glib-macros, gtk3-macros) through which Tauri reaches the
  # Linux window toolkit. No release of those bindings drops it; it runs only in the
  # compiler, never in the app. Revisit when Tauri's Linux backend moves on.
  { id = "RUSTSEC-2024-0370", reason = "build-time macro helper under Tauri's GTK 3 bindings; unmaintained, no vulnerability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
