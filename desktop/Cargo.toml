[package]
name = "hertzforge-desktop"
description = "The Hertzforge desktop app: the shell in a window of its own, with the control and analysis services started beside it."
version = "0.1.7"
edition = "2021"
license = "MIT"
publish = false
default-run = "hertzforge"

# Its own workspace, apart from the controller's: the window toolkit brings a few
# hundred crates (and on Linux the GTK and WebKit system libraries) that the control
# service's build, tests and lint have no reason to compile. It has its own lockfile
# and its own `cargo deny` check (desktop/deny.toml).
[workspace]

[[bin]]
name = "hertzforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Dragging the project or an object out of the window to save it (Brandon, 2026-11-11): the
# operating system's drag of files the analysis service has written
tauri-plugin-drag = "2"
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# The save window with a file type list (src/save_panel.rs). The window toolkit's dialog
# crate already brings these three; they are named here for the classes it does not use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSPopUpButton", "NSResponder", "NSSavePanel", "NSText", "NSTextField", "NSView", "NSWindow"] }
serde = { version = "1", features = ["derive"] }

[features]
# The local proof of the built app (packaging/e2e/): runs a script in the window
# that drives the shell the way an operator does. Never in a shipped build.
e2e = []
